name: Shared Video Worker Build

on:
  pull_request:
    paths:
      - "shared/video-worker/**"
      - "shared/livekit-avatar-agent/**"
      - "AGENTS.md"
      - "README.md"
      - "package.json"
      - "scripts/deploy-with-secrets-store.mjs"
      - "scripts/deploy-video-worker.sh"
      - "scripts/deploy-video-worker.ps1"
      - ".gitattributes"
      - ".github/workflows/video-worker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix shared/video-worker
      - run: npm test --prefix shared/video-worker
      - run: node --check shared/video-worker/src/index.js
      - run: bash -n scripts/deploy-video-worker.sh
      - name: Validate Windows broker deployment entry point
        shell: pwsh
        run: |
          $source = Get-Content scripts/deploy-video-worker.ps1 -Raw
          [scriptblock]::Create($source) | Out-Null
          if (-not $source.Contains('.Replace("\", "/")')) { throw "Windows path conversion must replace single backslashes." }
          $sample = "ai\cloudflare-platform".Replace("\", "/")
          if ($sample -ne "ai/cloudflare-platform") { throw "Windows path conversion failed: $sample" }
      - name: Enforce edge-relay-only boundary
        run: |
          ! grep -q '\[\[secrets_store_secrets\]\]' shared/video-worker/wrangler.toml
          grep -q 'BLACKHOLE_CAPABILITY_TOKEN=XYZ_DEMO_EILA_RUNTIME_TOKEN' package.json
          ! grep -q 'BLACKHOLE_AI_FANS_CAPABILITY_TOKEN\|BLACKHOLE_EILA_OVERWATCH_CAPABILITY_TOKEN' package.json
          grep -q 'main = "src/index.js"' shared/video-worker/wrangler.toml
          test ! -e shared/livekit-avatar-agent
          test ! -e shared/video-worker/src/index-eila-fallback.js
          grep -q 'edge relay only' AGENTS.md
      - run: npx --yes wrangler@4.126.0 deploy --dry-run --config shared/video-worker/wrangler.toml --outdir /tmp/video-worker-dry-run
