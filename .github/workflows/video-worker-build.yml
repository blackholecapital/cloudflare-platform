name: Shared Video Worker Build

on:
  pull_request:
    paths:
      - "shared/video-worker/**"
      - "package.json"
      - "scripts/deploy-with-secrets-store.mjs"
      - "scripts/deploy-video-worker.sh"
      - "scripts/deploy-video-worker.ps1"
      - ".gitattributes"
      - ".github/workflows/video-worker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix shared/video-worker
      - run: npm test --prefix shared/video-worker
      - run: node --check shared/video-worker/src/index-eila-fallback.js
      - run: node --check shared/video-worker/src/index.js
      - run: bash -n scripts/deploy-video-worker.sh
      - name: Validate Windows broker deployment entry point
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/deploy-video-worker.ps1 -Raw)) | Out-Null
      - name: Validate centralized tenant capability bindings
        run: |
          ! grep -q '\[\[secrets_store_secrets\]\]' shared/video-worker/wrangler.toml
          grep -q 'BLACKHOLE_AI_FANS_CAPABILITY_TOKEN=XYZ_DEMO_EILA_RUNTIME_TOKEN' package.json
          grep -q 'BLACKHOLE_EILA_OVERWATCH_CAPABILITY_TOKEN=XYZ_DEMO_EILA_RUNTIME_TOKEN' package.json
      - run: npx --yes wrangler@4.123.0 deploy --dry-run --config shared/video-worker/wrangler.toml --outdir /tmp/video-worker-dry-run
