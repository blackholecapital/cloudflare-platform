name: Secrets Store deploy helper

on:
  pull_request:
    paths:
      - "scripts/deploy-with-secrets-store.mjs"
      - "package.json"
      - "SECRETS_STORE_DEPLOY.md"
      - ".github/workflows/secrets-store-deploy-helper.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/deploy-with-secrets-store.mjs
