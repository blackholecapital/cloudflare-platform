<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Cloudflare Operations Platform</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<header>

<div>

<h1>☁ Cloudflare Operations Platform</h1>

<p class="subtitle">

Customer Provisioning Console

</p>

</div>

<div class="status">

● Connected

</div>

</header>

<div class="content">

<div class="panel">

<h2>Customer Information</h2>

<div class="grid">

<label>

Company

<input id="company" placeholder="Black Hole Capital">

</label>

<label>

Domain

<input id="domain" placeholder="blackhole.ai">

</label>

<label>

Contact Email

<input id="email" placeholder="admin@blackhole.ai">

</label>

</div>

<div class="buttons">

<button onclick="previewPlan()">

Preview Plan

</button>

<button class="primary"
onclick="provision()">

Provision Customer

</button>

</div>

<pre id="output">

Ready.

</pre>

</div>

<div class="panel">

<h2>Services</h2>

<div class="services">

<label><input type="checkbox" checked>Cloudflare Pages</label>
<label><input type="checkbox" checked>Workers</label>
<label><input type="checkbox" checked>D1 Database</label>
<label><input type="checkbox" checked>KV</label>
<label><input type="checkbox">R2 Storage</label>
<label><input type="checkbox">Email</label>
<label><input type="checkbox">SMS</label>
<label><input type="checkbox">Voice</label>
<label><input type="checkbox">AI Concierge</label>

</div>

</div>

</div>

<div class="footer">

<div>

Cloudflare Platform v0.1

</div>

<div>

Black Hole Capital

</div>

</div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
